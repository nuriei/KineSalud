<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>KineSalud</title>
    <link rel="stylesheet" type="text/css" href="../CSS/KineSalud.css">
    <script src="../JS/kinesalud.js" type="text/javascript"></script>
</head>
<body>
    <form name="formulario" method="GET" action="#">
        <strong>Ingresa tus datos para ponernos en contacto:</strong>
        <br>
        <br>Nombre: <input type="text" name="nombre">
        <br><br>
        Edad: <input type="text" name="edad">
        <br><br>
        Telefono: <input type="text" name="telefono" maxlength="10">
        <br><br>
        seleccione sexo:
        <label for="muj">mujer </label>
        <input type="radio" name="sexo" value="M" id="muj" checked>
        <label for="hom">hombre</label>
        <input type="radio" name="sexo" value="H" id="hom">
        <br><br>
        <hr>
        <br>
        <strong>Selecciona nuestros tratamientos:</strong>
        <br><br>
        <input type="checkbox" name="Kinesiologia" value="kinesiologia">kinesioligia
        <input type="checkbox" name="Kinebot" value="kinebot">kinebot
        <input type="checkbox" name="Tecarterapia" value="tecaterapia">tecaterapia
        <input type="checkbox" name="Vacumterapia" value="vacumterapia">vacumterapia
        <br>
        <input type="checkbox" name="Punsion seca" value="punsion seca">punsion seca
        <input type="checkbox" name="Sillones de masajes" value="sillon de masajes">sillon de masajes
        <input type="checkbox" name="Magnetoterapia" value="magnetoterapia">magnetoterapia
        <br><br>
        <hr>
        <strong>Comentarios:</strong>
        <br>
        <br>
        <textarea name="comentario" rows="5" cols="25" wrap="hard"></textarea>
        <br><br>
        <hr>
        <input type="button" value="Solicitar turno" onclick="return cargar();">
    </form>
</body>
</html>
